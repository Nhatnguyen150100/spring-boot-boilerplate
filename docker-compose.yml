# =============================================================================
#  Local development stack.
#
#  Values come from .env (see .env.example). Compose uses that same file both
#  for ${...} interpolation here and, via env_file, for the app container - so
#  there is exactly one place to change a value.
# =============================================================================

services:
  # ===============================
  # = MySQL Database Service
  # ===============================
  mysql:
    image: mysql:8.0
    container_name: springapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-db_test_spring}
      # The MySQL image refuses MYSQL_USER=root, so DB_USERNAME must name a
      # dedicated application user when running through Compose.
      MYSQL_USER: ${DB_USERNAME:-springapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-springapp}
      TZ: UTC
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # db/migrations is NOT mounted into docker-entrypoint-initdb.d: Flyway
      # owns the schema, and letting MySQL replay the same files would leave
      # flyway_schema_history out of step with the database.
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - springapp-network

  # ===============================
  # = Redis Service
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: springapp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - springapp-network

  # ===============================
  # = Spring Boot Application
  # ===============================
  springapp:
    image: springapp:latest
    container_name: springapp-api
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    # Everything the app reads comes from .env, so this file never has to repeat
    # (and never has to be kept in sync with) the full variable list.
    env_file:
      - path: .env
        required: false
    environment:
      # Only the values that MUST differ inside the Compose network.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - springapp-network

# ===============================
# = Networks
# ===============================
networks:
  springapp-network:
    driver: bridge

# ===============================
# = Volumes
# ===============================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

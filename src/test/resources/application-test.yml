# =============================================================================
#  TEST profile - keeps `mvn test` hermetic.
#
#  Every value here is a LITERAL, never a ${ENV_VAR} placeholder. That matters
#  for two separate reasons:
#    1. application.yml imports the developer's local .env FILE, and a literal
#       here cannot be overridden by it.
#    2. Spring's placeholder resolution (${ASYNC_TASK_CORE_SIZE:5} etc. in
#       application.yml) also checks plain OS environment variables, which a
#       literal here shields against too. Any property bound to an
#       @jakarta.validation constraint MUST be overridden with a literal below
#       -- otherwise an exported shell variable of the same name (common in a
#       long-lived dev shell or a CI runner) can fail validation and break the
#       build for a reason that has nothing to do with the code under test.
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:springapp;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # The schema comes from the entities here, not from Flyway.
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    # The migrations are MySQL-specific, so they are not replayed against H2.
    enabled: false

application:
  redis:
    # No Redis running during tests; the context must still come up.
    fail-fast: false
  security:
    jwt:
      # Test-only, and deliberately not the dev fallback from application.yml -
      # so the test still passes if that value is ever removed.
      secret-key: dGVzdC1vbmx5LXNlY3JldC1uZXZlci11c2VkLW91dHNpZGUtdW5pdC10ZXN0cw==
      expiration: 86400000
      refresh-expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000
  mail:
    host: localhost
    port: 1025
    app: SPRING_APP_TEST
    from: test@example.com
    username: test@example.com
    password: test
    ssl-enable: false
  file:
    storage:
      upload-dir: uploads-test
  cache:
    default-ttl: 30m
    users-ttl: 10m
    tokens-ttl: 5m
  async:
    task:
      core-size: 1
      max-size: 1
      queue-capacity: 1
    email:
      core-size: 1
      max-size: 1
      queue-capacity: 1

logging:
  level:
    root: WARN
    com.spring.app: INFO

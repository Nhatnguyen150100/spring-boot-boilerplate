# =============================================================================
#  Production stack.
#
#  Requires a .env file next to this one (see .env.example). Unlike the dev
#  stack, .env is mandatory here and no value falls back to a development
#  default - a missing variable must stop the deployment.
# =============================================================================

services:
  # ===============================
  # = MySQL Database Service (Production)
  # ===============================
  mysql:
    image: mysql:8.0
    container_name: springapp-mysql-prod
    restart: always
    environment:
      # Separate from DB_PASSWORD: the app must not connect as root.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      # db/migrations is NOT mounted into docker-entrypoint-initdb.d: Flyway
      # owns the schema, and replaying the same files here would leave
      # flyway_schema_history out of step with the database.
      - mysql_prod_data:/var/lib/mysql
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - springapp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # = Redis Service (Production)
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: springapp-redis-prod
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    command: 
      - redis-server
      - --appendonly yes
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - springapp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===============================
  # = Spring Boot Application (Production)
  # ===============================
  springapp:
    image: springapp:latest
    container_name: springapp-api-prod
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    # Everything the app reads comes from .env, so this file never has to repeat
    # (and never has to be kept in sync with) the full variable list.
    env_file:
      - .env
    environment:
      # Only the values that MUST differ inside the Compose network, plus the
      # production hard-defaults that must not be overridable from .env.
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/app/uploads
      - LOG_PATH=/var/log/springapp
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/var/log/springapp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - springapp-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

# ===============================
# = Networks
# ===============================
networks:
  springapp-network:
    driver: bridge

# ===============================
# = Volumes (Production)
# ===============================
volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local

